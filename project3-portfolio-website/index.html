<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Niclas Hugdahl – Developer Portfolio</title>
    <!--
      Runs before the page is drawn, so a visitor who chose the light theme
      doesn't see a dark flash while React loads. It reads the same
      "theme" key that useLocalStorage writes (stored as JSON).
    -->
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem("theme"));
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // No saved theme or storage is blocked: the dark default is used.
      }
    </script>
  </head>
  <body>
    <!--
      Only shown when JavaScript is off. React builds the whole page in the
      browser, so without JS #root stays empty. The built CSS is a normal
      <link> in the head, so the global styles (colours, fonts) still apply.
    -->
    <noscript>
      <main
        style="
          max-width: var(--content-max);
          margin: var(--space-6) auto;
          padding: 0 var(--space-4);
        "
      >
        <h1>JavaScript is required</h1>
        <p>
          This portfolio is built with React and needs JavaScript to show its
          content. Please turn JavaScript on in your browser and reload the
          page.
        </p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
