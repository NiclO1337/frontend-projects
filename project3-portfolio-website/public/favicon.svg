<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#16162e"/>
      <stop offset="100%" stop-color="#07070f"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- neon tube glow -->
  <path d="M19 47 V17 L45 47 V17" fill="none" stroke="#00e5ff" stroke-width="6.5"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- bright core -->
  <path d="M19 47 V17 L45 47 V17" fill="none" stroke="#e8ffff" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
