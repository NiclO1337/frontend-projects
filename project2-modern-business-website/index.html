<!DOCTYPE html>
<!-- data-bs-theme="dark" switches Bootstrap to its dark colour mode (dark theme only, no toggle) -->
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- Makes the page scale properly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bun Intended – Smash burgers. Seriously good puns.</title>
  <meta name="description" content="Bun Intended is a smash burger restaurant on Södermalm in Stockholm. See the menu, check our opening hours and book a table.">

  <!-- Google Fonts: preconnect makes the font request start earlier, display=swap shows text right away in a fallback font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merienda:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS first, then Font Awesome, then our own stylesheet last so it can override Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Skip link: first focusable element, only visible when focused with the keyboard -->
  <a class="visually-hidden-focusable" href="#main">Skip to content</a>

  <header>
    <!-- Navbar goes here (step 3) -->
  </header>

  <main id="main">
    <h1>Bun Intended</h1>
    <!-- Hero, slider and home content go here (steps 5–8) -->
  </main>

  <footer>
    <!-- Footer goes here (step 3) -->
  </footer>

  <!-- Bootstrap's JS bundle (includes Popper) powers the navbar toggle and the carousel. defer = run after the HTML is parsed -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>
</html>
